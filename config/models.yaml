# Model Plane — Model Catalog
# Each entry is a LiteLLM-resolvable deployment.
# Keep provider credentials in env vars, never in this file.

deployments:
  # ── Local / self-hosted ──────────────────────────────────────────────────
  # Uncomment and set LOCAL_*_API_BASE in .env when you have a local vLLM/Ollama running.
  # - name: local-small
  #   litellm_model: openai/mistral-7b-instruct
  #   provider: local
  #   api_base_env: LOCAL_SMALL_API_BASE      # set LOCAL_SMALL_API_BASE=http://localhost:11434/v1
  #   api_key_env: LOCAL_SMALL_API_KEY
  #   context_limit: 8192
  #   cost_per_1k_input: 0.0
  #   cost_per_1k_output: 0.0
  #   tier: small
  #   capabilities: [text, summarization]
  #   tags: [local, fast]
  #   fallback_to: [watsonx-granite-small]
  #   max_parallel_requests: 100

  # ── OpenAI ───────────────────────────────────────────────────────────────
  - name: openai-gpt4o-mini
    litellm_model: gpt-4o-mini
    provider: openai
    api_key_env: OPENAI_API_KEY
    context_limit: 128000
    cost_per_1k_input: 0.00015
    cost_per_1k_output: 0.0006
    tier: medium
    capabilities:
      - text
      - code
      - function-calling
      - json-mode
    tags: [openai, fast]
    fallback_to: [anthropic-haiku]
    rpm: 500

  - name: openai-gpt4o
    litellm_model: gpt-4o
    provider: openai
    api_key_env: OPENAI_API_KEY
    context_limit: 128000
    cost_per_1k_input: 0.005
    cost_per_1k_output: 0.015
    tier: complex
    capabilities:
      - text
      - code
      - function-calling
      - json-mode
      - vision
      - long-context
    tags: [openai]
    fallback_to: [anthropic-sonnet]
    rpm: 200

  - name: openai-o1-mini
    litellm_model: o1-mini
    provider: openai
    api_key_env: OPENAI_API_KEY
    context_limit: 128000
    cost_per_1k_input: 0.003
    cost_per_1k_output: 0.012
    tier: reasoning
    capabilities:
      - reasoning
      - math
      - code
    tags: [openai, reasoning]
    fallback_to: [anthropic-sonnet-thinking]
    rpm: 100

  # ── Anthropic ────────────────────────────────────────────────────────────
  - name: anthropic-haiku
    litellm_model: anthropic/claude-3-haiku-20240307
    provider: anthropic
    api_key_env: ANTHROPIC_API_KEY
    context_limit: 200000
    cost_per_1k_input: 0.00025
    cost_per_1k_output: 0.00125
    tier: small
    capabilities:
      - text
      - function-calling
      - long-context
    tags: [anthropic, fast]
    fallback_to: [openai-gpt4o-mini]
    rpm: 1000

  - name: anthropic-sonnet
    litellm_model: anthropic/claude-3-5-sonnet-20241022
    provider: anthropic
    api_key_env: ANTHROPIC_API_KEY
    context_limit: 200000
    cost_per_1k_input: 0.003
    cost_per_1k_output: 0.015
    tier: complex
    capabilities:
      - text
      - code
      - function-calling
      - long-context
      - vision
    tags: [anthropic, coding]
    fallback_to: [openai-gpt4o]
    rpm: 200

  - name: anthropic-sonnet-thinking
    litellm_model: anthropic/claude-3-7-sonnet-20250219
    provider: anthropic
    api_key_env: ANTHROPIC_API_KEY
    context_limit: 200000
    cost_per_1k_input: 0.003
    cost_per_1k_output: 0.015
    tier: reasoning
    capabilities:
      - reasoning
      - code
      - long-context
    tags: [anthropic, reasoning]
    fallback_to: [openai-o1-mini]
    rpm: 100

  # ── IBM watsonx.ai ────────────────────────────────────────────────────────
  # Model IDs verified live against the watsonx foundation_model_specs API.
  # Requires env vars: WATSONX_APIKEY, WATSONX_PROJECT_ID, WATSONX_URL

  - name: watsonx-granite-small
    litellm_model: watsonx/ibm/granite-4-h-small   # granite-3-1-8b-base is text-gen only, not chat
    provider: watsonx
    api_key_env: WATSONX_APIKEY
    context_limit: 20480
    cost_per_1k_input: 0.0003
    cost_per_1k_output: 0.0009
    tier: small
    capabilities:
      - text
      - summarization
      - code
      - function-calling
      - json-mode
    tags: [watsonx, sovereign]
    fallback_to: [watsonx-granite-medium]
    max_parallel_requests: 50

  - name: watsonx-granite-medium
    litellm_model: watsonx/ibm/granite-4-h-small
    provider: watsonx
    api_key_env: WATSONX_APIKEY
    context_limit: 20480
    cost_per_1k_input: 0.0005
    cost_per_1k_output: 0.0015
    tier: medium
    capabilities:
      - text
      - code
      - structured_extraction
      - function-calling
      - json-mode
      - long-context
    tags: [watsonx, sovereign]
    fallback_to: [watsonx-granite-small]
    max_parallel_requests: 30

  - name: watsonx-granite-large
    litellm_model: watsonx/meta-llama/llama-3-3-70b-instruct
    provider: watsonx
    api_key_env: WATSONX_APIKEY
    context_limit: 128000
    cost_per_1k_input: 0.0009
    cost_per_1k_output: 0.0009
    tier: complex
    capabilities:
      - text
      - code
      - structured_extraction
      - function-calling
      - long-context
      - reasoning
    tags: [watsonx, sovereign]
    fallback_to: [watsonx-granite-medium]
    max_parallel_requests: 20

  - name: watsonx-mistral-medium
    litellm_model: watsonx/mistralai/mistral-small-3-1-24b-instruct-2503
    provider: watsonx
    api_key_env: WATSONX_APIKEY
    context_limit: 32768
    cost_per_1k_input: 0.0006
    cost_per_1k_output: 0.0018
    tier: medium
    capabilities:
      - text
      - code
      - function-calling
      - json-mode
    tags: [watsonx, sovereign]
    fallback_to: [watsonx-granite-medium]
    max_parallel_requests: 20

  - name: watsonx-mistral-large
    litellm_model: watsonx/mistral-large-2512
    provider: watsonx
    api_key_env: WATSONX_APIKEY
    context_limit: 128000
    cost_per_1k_input: 0.002
    cost_per_1k_output: 0.006
    tier: complex
    capabilities:
      - text
      - code
      - function-calling
      - json-mode
      - long-context
      - reasoning
    tags: [watsonx, sovereign]
    fallback_to: [watsonx-granite-large]
    max_parallel_requests: 10
