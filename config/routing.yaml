scorer_weights:
  reasoning_markers: 0.18
  code_presence: 0.15
  simple_indicators: 0.12
  multi_step_patterns: 0.12
  technical_terms: 0.1
  token_count: 0.08
  creative_markers: 0.05
  question_complexity: 0.05
  constraint_count: 0.04
  imperative_verbs: 0.03
  output_format: 0.03
  domain_specificity: 0.02
  reference_complexity: 0.02
  negation_complexity: 0.01
  cost_input_weight: 0.2
  cost_output_weight: 0.08
tier_defaults:
  simple: watsonx-granite-small
  medium: watsonx-granite-medium
  complex: watsonx-mistral-large
  reasoning: watsonx-granite-large
preferred_providers:
- local
- watsonx
- anthropic
- openai
task_overrides:
  simple_qa: simple
  summarization: medium
  translation: simple
  creative_writing: medium
  structured_extraction: medium
task_deployment_overrides:
  code_debugging:
    preferred_deployments:
    - local-qwen-27b
    - watsonx-granite-large
    - watsonx-mistral-medium
  code_generation:
    preferred_deployments:
    - local-qwen-27b
    - watsonx-granite-large
    - watsonx-mistral-medium
  mathematical_reasoning:
    preferred_deployments:
    - local-qwen-27b
    - watsonx-granite-large
    - watsonx-mistral-large
  technical_reasoning:
    preferred_deployments:
    - local-qwen-27b
    - watsonx-mistral-large
    - watsonx-granite-large
  long_context_synthesis:
    preferred_deployments:
    - watsonx-granite-large
    - watsonx-mistral-large
  structured_extraction:
    preferred_deployments:
    - watsonx-mistral-medium
    - watsonx-granite-medium
thresholds:
  ml_confidence_min: 0.7
  routing_confidence_low: 0.45
  complexity_score_simple: 0.25
  complexity_score_complex: 0.55
  complexity_score_reasoning: 0.75
ml_guards:
  upgrade_cap_conf: 0.8
  downgrade_veto_conf: 0.75
  skip_ml_classifier_conf: 0.9
  skip_ml_scorer_conf: 0.45
tenant_policies:
- tenant_id: regulated-tenant-1
  allowed_providers:
  - watsonx
  regulated_tasks:
  - structured_extraction
  - planning
  regulated_deployment: watsonx-granite-medium
  max_tokens_per_request: 32768
- tenant_id: cost-sensitive-tenant
  allowed_providers:
  - local
  - openai
  denied_deployments:
  - anthropic-sonnet
  - anthropic-sonnet-thinking
  max_cost_per_request: 0.05
compression_profiles:
  code_generation: code_context_reduction
  code_editing: code_context_reduction
  code_debugging: code_context_reduction
  repository_search: code_context_reduction
  tool_call_interpretation: tool_output_compaction
  long_context_synthesis: conversation_summary
  summarization: passthrough
  default: auto
escalation:
  max_retries: 2
  escalate_on_schema_fail: true
  escalate_on_tool_fail: true
  fallback_chain:
  - watsonx-mistral-large
  - watsonx-granite-large
  - watsonx-granite-medium
classifier:
  active: regex
  mbert_enabled: true
  laya_enabled: true
provider_trust_overrides: {}
