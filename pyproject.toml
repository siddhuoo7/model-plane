[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-plane"
version = "0.1.0"
description = "Production-grade model control plane and smart router built on LiteLLM"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "litellm>=1.40.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "structlog>=24.2.0",
    "prometheus-client>=0.20.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "numpy>=1.26.0",
    "tiktoken>=0.7.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "redis>=5.0.0",
    "orjson>=3.10.0",
    "tenacity>=8.4.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
]
bert = [
    # Zero-shot intent classifier via HuggingFace transformers.
    # Default model: llm-semantic-router/mmbert32k-intent-classifier-merged (149M ModernBERT, CPU <83ms)
    # Install: pip install 'model-plane[bert]'
    "transformers>=4.40.0",
    "torch>=2.2.0",
]
laya = [
    # Local in-process Laya classifier — no API key, no network call.
    # Answers BOTH task_type (score) AND complexity_tier (choice) in one call.
    # Install: pip install 'model-plane[laya]'
    "laya>=0.1.0",
]
all-classifiers = [
    # Install every optional classifier backend in one shot:
    #   pip install 'model-plane[all-classifiers]'
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "laya>=0.1.0",
]

[project.scripts]
model-plane = "model_plane.main:cli"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=model_plane --cov-report=term-missing -q"
